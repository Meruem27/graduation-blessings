<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光信封 · 吕大帅的祝福</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <script type="application/json" id="blessing-data">
  {
    "name": "吕大帅",
    "blessings": [
      {
        "from": "吕艾薇",
        "text": "谢谢自己，勇敢地选择了自己心中的路，我将拥有更加自由的人生。（社会是棵参天树，我叫艾薇你记住。）"
      },
      {
        "from": "陈思锐",
        "text": "吕总毕业快乐！小弟将永远追随您的脚步，愿有前程可奔赴，亦有岁月可回首！风里雨里清华小组等你！"
      },
      {
        "from": "林佳",
        "text": "顺风时就展开双翅飞翔 逆风是就当成在冲浪"
      },
      {
        "from": "林俊宏",
        "text": "毕业快乐！愿未来皆坦荡！"
      },
      {
        "from": "杨梓萱",
        "text": "艾、薇，芳草美人也。前路必是草木蔓发，春山可望~"
      },
      {
        "from": "林润豪",
        "text": "祝吕大帅毕业快乐，前途似锦！愿你活得更加自信、更加潇洒、多多思考、对自己的决定无悔，积极向前看追求未来更好的自我，祝你自信出场谁能敌，未来一路创佳绩；成功上岸有底气，钱包鼓鼓很争气；万事顺意常欢喜，人生高光属于你！"
      },
      {
        "from": "林钰凯",
        "text": "祝前程似锦，万事皆如愿！"
      },
      {
        "from": "张佳仪",
        "text": "未来未知的生活如同盲盒，希望你不断开出自己心意的隐藏款！一直都是那个勇敢、开朗、洒脱、幽默、细腻的艾薇。"
      },
      {
        "from": "许哲嘉",
        "text": "毕业是这段青春故事的终章，更是崭新篇章的序言。或许前路不会一帆风顺，但相信你定能乘风破浪。"
      }
    ]
  }
  </script>

  <div class="letter-scene">
    <div class="detail-envelope">
      <div class="detail-envelope-body">
        <div class="detail-envelope-flap"></div>
        <span class="detail-envelope-name">吕大帅</span>
        <div class="detail-envelope-wax"></div>
      </div>
    </div>
    <div class="letter-paper">
      <div id="blessing-list"></div>
    </div>
    <a href="./index.html" class="back-btn">
      <span class="arrow">←</span> 返回信封架
    </a>
  </div>

  <div class="page-footer"></div>
  <script src="./js/detail.js"></script>
</body>
</html>
