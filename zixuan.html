<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光信封 · 梓萱的祝福</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <script type="application/json" id="blessing-data">
  {
    "name": "梓萱",
    "blessings": [
      {
        "from": "吕艾薇",
        "text": "梓萱毕业快乐！从学生到老师的转变没有那么容易~有什么烦恼和不适应多跟我们说说~早日遇到心动男生😄"
      },
      {
        "from": "陈思锐",
        "text": "梓萱毕业快乐～愿径行直遂，青云万里！"
      },
      {
        "from": "林佳",
        "text": "下段旅程你一定要更幸福丰盛"
      },
      {
        "from": "林俊宏",
        "text": "毕业快乐！愿未来皆坦荡！"
      },
      {
        "from": "杨梓萱",
        "text": "梓木凌云，萱草忘忧。愿紫气东来，喜乐常伴，一路顺遂！"
      },
      {
        "from": "林润豪",
        "text": "祝梓萱毕业快乐，前途似锦！愿你未来生活充实美好，相信你一定是一位称职的好老师，希望你能在教育的道路上发光发热，天天跟年轻人打交道保持年轻心态，祝你未来一路好运临，万事顺意向前行！"
      },
      {
        "from": "林钰凯",
        "text": "祝平安喜乐，未来一路繁花！"
      },
      {
        "from": "张佳仪",
        "text": "陈春杳杳，来岁昭昭。祝福你遇到很好教、爱学习、尊重老师的学生，每天都有幸福的事情发生！"
      },
      {
        "from": "许润钿",
        "text": "毕业是崭新篇章的序言，愿我们在看不见彼此的日子里都熠熠生辉。"
      }
    ]
  }
  </script>

  <div class="letter-scene">
    <div class="detail-envelope">
      <div class="detail-envelope-body">
        <div class="detail-envelope-flap"></div>
        <span class="detail-envelope-name">梓萱</span>
        <div class="detail-envelope-wax"></div>
      </div>
    </div>
    <div class="letter-paper">
      <div id="blessing-list"></div>
    </div>
    <a href="./index.html" class="back-btn">
      <span class="arrow">←</span> 返回信封架
    </a>
  </div>

  <div class="page-footer"></div>
  <script src="./js/detail.js"></script>
</body>
</html>
