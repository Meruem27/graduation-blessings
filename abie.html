<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光信封 · 阿鳖的祝福</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <script type="application/json" id="blessing-data">
  {
    "name": "阿鳖",
    "blessings": [
      {
        "from": "吕艾薇",
        "text": "钰凯，你有很容易亲近人和融入集体的能力，毕业后会越来越好的~"
      },
      {
        "from": "陈思锐",
        "text": "钰凯毕业快乐～愿前程似锦，一路繁花！"
      },
      {
        "from": "林佳",
        "text": "前路璀璨万事顺"
      },
      {
        "from": "林俊宏",
        "text": "毕业快乐！愿未来皆坦荡！"
      },
      {
        "from": "杨梓萱",
        "text": "功不唐捐，钰（玉）汝于成。愿此去凯歌高奏，风帆远扬！"
      },
      {
        "from": "林润豪",
        "text": "祝阿鳖毕业快乐，前途似锦！愿你保持乐观心态，积极努力、不要秃头，祝你万事顺遂路宽广，前程似锦放光芒！"
      },
      {
        "from": "林钰凯",
        "text": "尚可"
      },
      {
        "from": "张佳仪",
        "text": "祝福你的每一份播种都有收获。一直勇敢下去吧，我眼里的你一直是那么的勇敢和富有善意！"
      },
      {
        "from": "许哲嘉",
        "text": "相信你定能乘风破浪，愿我们各自努力。"
      }
    ]
  }
  </script>

  <div class="letter-scene">
    <div class="detail-envelope">
      <div class="detail-envelope-body">
        <div class="detail-envelope-flap"></div>
        <span class="detail-envelope-name">阿鳖</span>
        <div class="detail-envelope-wax"></div>
      </div>
    </div>
    <div class="letter-paper">
      <div id="blessing-list"></div>
    </div>
    <a href="./index.html" class="back-btn">
      <span class="arrow">←</span> 返回信封架
    </a>
  </div>

  <div class="page-footer"></div>
  <script src="./js/detail.js"></script>
</body>
</html>
