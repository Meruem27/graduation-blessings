<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光信封 · 佳仪的祝福</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <script type="application/json" id="blessing-data">
  {
    "name": "佳仪",
    "blessings": [
      {
        "from": "陈思锐",
        "text": "佳仪毕业快乐～春日有信，未来可期！风里雨里清华小组等你！"
      },
      {
        "from": "林佳",
        "text": "随风翩翩起舞 为明天持续征服"
      },
      {
        "from": "林俊宏",
        "text": "毕业快乐！愿未来皆坦荡！"
      },
      {
        "from": "杨梓萱",
        "text": "佳木向阳，肆意生长；愿从此仪（怡）然自得，阅遍星光！"
      },
      {
        "from": "林润豪",
        "text": "祝佳仪毕业快乐，前途似锦！工作事业都顺利，好运天天来报喜；健康快乐有福气，理想生活甜蜜蜜！"
      },
      {
        "from": "鳖",
        "text": "祝我的老同桌前程灿烂，未来一切都好！"
      },
      {
        "from": "张佳仪",
        "text": "日拱一卒，功不唐捐。不要害怕失败，要不成功，要不成长。"
      },
      {
        "from": "许润钿",
        "text": "愿我们各自努力，在看不见彼此的日子里都熠熠生辉。"
      }
    ]
  }
  </script>

  <div class="letter-scene">
    <div class="detail-envelope">
      <div class="detail-envelope-body">
        <div class="detail-envelope-flap"></div>
        <span class="detail-envelope-name">佳仪</span>
        <div class="detail-envelope-wax"></div>
      </div>
    </div>
    <div class="letter-paper">
      <div id="blessing-list"></div>
    </div>
    <a href="./index.html" class="back-btn">
      <span class="arrow">←</span> 返回信封架
    </a>
  </div>

  <div class="page-footer"></div>
  <script src="./js/detail.js"></script>
</body>
</html>
