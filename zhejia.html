<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光信封 · 哲嘉的祝福</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <script type="application/json" id="blessing-data">
  {
    "name": "哲嘉",
    "blessings": [
      {
        "from": "陈思锐",
        "text": "哲嘉毕业快乐～踏破荆棘，一路繁花！风里雨里清华小组等你！"
      },
      {
        "from": "林佳",
        "text": "事业有成步步升"
      },
      {
        "from": "林俊宏",
        "text": "毕业快乐！愿未来皆坦荡！"
      },
      {
        "from": "杨梓萱",
        "text": "哲思明澈，嘉木葱茏。祝遇哲人，成嘉事，好运常在！"
      },
      {
        "from": "林润豪",
        "text": "祝哲嘉毕业快乐，前途似锦！祝你保持自信、积极努力成就更好的自我，愿你毕业启新程，未来一路都能赢，身体健康好运迎，万事顺意向前行！"
      },
      {
        "from": "鳖",
        "text": "祝前程万里，一帆风顺！"
      },
      {
        "from": "张佳仪",
        "text": "别害怕，快去往璀璨年华，捧到诗篇和铠甲，摘星建高塔，做勇敢的大人吧！哲嘉，请记住我们清华群一直都在！"
      },
      {
        "from": "许润钿",
        "text": "或许前路不会一帆风顺，但相信你定能乘风破浪。"
      }
    ]
  }
  </script>

  <div class="letter-scene">
    <div class="detail-envelope">
      <div class="detail-envelope-body">
        <div class="detail-envelope-flap"></div>
        <span class="detail-envelope-name">哲嘉</span>
        <div class="detail-envelope-wax"></div>
      </div>
    </div>
    <div class="letter-paper">
      <div id="blessing-list"></div>
    </div>
    <a href="./index.html" class="back-btn">
      <span class="arrow">←</span> 返回信封架
    </a>
  </div>

  <div class="page-footer"></div>
  <script src="./js/detail.js"></script>
</body>
</html>
